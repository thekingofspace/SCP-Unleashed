plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    maven {
        name = 'VeilBlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'foundry.veil'
            includeGroup 'gg.moonflower'
            includeGroup 'io.github.ocelot'
        }
    }
    // Modrinth's maven, used for Jade
    exclusiveContent {
        forRepository {
            maven {
                name = 'Modrinth'
                url = 'https://api.modrinth.com/maven'
            }
        }
        filter {
            includeGroup 'maven.modrinth'
        }
    }
    // JEI
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
        content {
            includeGroup 'mezz.jei'
        }
    }
    // GeckoLib
    maven {
        name = 'GeckoLib'
        url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup 'software.bernie.geckolib'
        }
    }
    // Curios
    maven {
        name = 'Curios'
        url = 'https://maven.theillusivec4.top/'
        content {
            includeGroup 'top.theillusivec4.curios'
        }
    }
    maven {
        name = 'Henkel'
        url = 'https://maven.maxhenkel.de/repository/public'
        content {
            includeGroup 'de.maxhenkel.voicechat'
        }
    }
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()


            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
tasks.named('jar', Jar) {
    exclude { Element ->
        String Path = Element.relativePath.pathString
        boolean Mixin = Path.startsWith('net/rai/scp_unleashed/mixin/')
        boolean TestPackage = !Mixin && (Path.contains('/gametest/') || Path.endsWith('/gametest'))
        boolean TestClass = Path.endsWith('GameTests.class') || Path.contains('GameTests$')
        TestPackage || TestClass
    }
}

sourceSets.main.resources {
    exclude 'assets/scp_unleashed/lang/.git', 'assets/scp_unleashed/lang/.git/**', 'assets/scp_unleashed/lang/.gitattributes', 'assets/scp_unleashed/lang/.gitignore', 'assets/scp_unleashed/lang/README.md'
}


// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // GeckoLib (required)
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    jarJar(implementation("foundry.veil:veil-neoforge-${minecraft_version}")) {
        version {
            strictly veil_version_range
            prefer veil_version
        }
    }

    // JEI (optional)
    // The full jar already bundles JEI's common/gui/library code, so its POM dependencies would only duplicate it.
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}") {
        transitive = false
    }

    // Jade (optional)
    // The API ships inside the main jar
    compileOnly "maven.modrinth:jade:${jade_version}"
    localRuntime "maven.modrinth:jade:${jade_version}"

    // Curios (optional)
    // Compiled against the api jar only; the full mod runs on both sides, so it is safe in every dev run including GameTest servers
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    localRuntime "top.theillusivec4.curios:curios-neoforge:${curios_version}"

    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.24"

    // Punchy (optional, client only)
    // Loaded in the dev client for testing first person animations. It is left out when a server,
    // GameTest or data run is requested, because Punchy cannot load on a dedicated server.
    def serverSideRun = gradle.startParameter.taskNames.any { Name ->
        def Lower = Name.toLowerCase()
        Lower.contains('server') || Lower.contains('gametest') || Lower.contains('rundata')
    }
    if (!serverSideRun) {
        localRuntime "maven.modrinth:punchy-fpa:${punchy_version}"
        localRuntime "maven.modrinth:simple-voice-chat:${voicechat_dev_version}"
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             geckolib_version_range : geckolib_version_range,
                             jei_version_range      : jei_version_range,
                             jade_version_range     : jade_version_range,
                             punchy_version_range   : punchy_version_range,
                             curios_version_range   : curios_version_range,
                             veil_version_range     : veil_version_range]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.fork = true
    options.forkOptions.memoryMaximumSize = "6g"
}
